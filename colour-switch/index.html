<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Colour Switch</title>
  <style>
    body{margin:0;padding:10px;font-family:Arial,sans-serif;background:#fff}.container{max-width:820px;margin:0 auto;background:#fff;padding:20px}.field-group{margin-bottom:16px}.field-label{display:block;margin-bottom:6px;font-weight:bold;color:#333;font-size:14px}.field-input{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid #ddd;border-radius:4px;font-size:14px}.option-selector{display:flex;gap:10px}.option-button{flex:1;padding:9px;border:2px solid #ddd;border-radius:4px;text-align:center;cursor:pointer}.option-button.selected{border-color:#0074d9;background:#0074d9;color:#fff}.section-divider{margin:24px 0 0;border-top:2px solid #eee;padding-top:18px}.section-title{font-weight:bold;font-size:16px;margin-bottom:14px}.option-card{background:#fafafa;border:1px solid #ddd;border-radius:6px;padding:14px;margin-bottom:14px}.option-card h3{margin:0 0 12px;font-size:15px}.thumbnail-fields{display:none}.show-thumbnails .thumbnail-fields{display:block}.hint{font-size:12px;color:#666;margin-top:5px}.loading-overlay{display:none;position:fixed;inset:0;background:rgba(255,255,255,.9);align-items:center;justify-content:center;z-index:10}.loading-overlay.show{display:flex}.loading-spinner{width:36px;height:36px;border:3px solid #eee;border-top-color:#0074d9;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

<body>
  <div class="loading-overlay" id="loadingOverlay"><div class="loading-spinner"></div></div>
  <div class="container" id="mainContainer">
    <h2 style="margin-top:0;color:#333;">Colour Switch</h2>
    <div class="field-group">
      <label class="field-label">Selector Style</label>
      <div class="option-selector" id="thumbnailStyleSelector">
        <div class="option-button selected" data-value="swatches">Colour swatch circles</div>
        <div class="option-button" data-value="images">Image thumbnails</div>
      </div>
      <div class="hint">Choose whether the clickable controls are the existing coloured circles or product image thumbnails.</div>
    </div>
    <div class="field-group"><label class="field-label" for="moduleName">Module Name</label><input id="moduleName" class="field-input" type="text"></div>
    <div class="field-group"><label class="field-label" for="numberOfColourOptions">Number of Options</label><input id="numberOfColourOptions" class="field-input" type="number" min="1" max="10"></div>
    <div class="field-group"><label class="field-label" for="coloursPerRow">Options per Row</label><input id="coloursPerRow" class="field-input" type="number" min="1" max="5"></div>
    <div class="field-group"><label class="field-label" for="productPageLink">Product Page Link</label><input id="productPageLink" class="field-input" type="url"></div>
    <div class="field-group"><label class="field-label" for="buttonText">Button Text</label><input id="buttonText" class="field-input" type="text"></div>
    <div class="field-group"><label class="field-label" for="buttonLink">Optional Button Link</label><input id="buttonLink" class="field-input" type="url"></div>
    <div class="field-group"><label class="field-label">Background Colour</label><div class="option-selector" id="backgroundColourSelector"><div class="option-button" data-value="red">Red</div><div class="option-button selected" data-value="black">Black</div><div class="option-button" data-value="white">White</div></div></div>
    <div class="field-group"><label class="field-label" for="fallbackImage">Fallback Image</label><input id="fallbackImage" class="field-input" type="url"></div>
    <div class="field-group"><label class="field-label" for="fallbackImageAltText">Fallback Image Alt Text</label><input id="fallbackImageAltText" class="field-input" type="text"></div>
    <div class="section-divider"><div class="section-title">Options</div><div id="optionsContainer"></div></div>
  </div>
  <script src="https://example.com/customblock-base"></script>
  <script src="https://example.com/customblock-blocksdk"></script>
  <script>
    'use strict';
    const labels = ['One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten'];
    const defaults = {
      moduleName:'bolt-100-colour-swap-01', thumbnailStyle:'swatches', numberOfColourOptions:8, coloursPerRow:4,
      productPageLink:'https://www.milwaukeetool.eu/en-eu/bolt-100/bolt-100/', buttonText:'View product', buttonLink:'', backgroundColour:'black',
      fallbackImage:'https://static.milwaukeetool.eu/remote.axd/milwaukee-media-images.s3.amazonaws.com/hi/4932478122--Hero_1.png', fallbackImageAltText:'BOLT 100 white safety helmet',
      options:[
        {image:'https://static.milwaukeetool.eu/remote.axd/milwaukee-media-images.s3.amazonaws.com/hi/4932478122--Hero_1.png',thumbnailImage:'',swatchColour:'#ffffff',altText:'BOLT 100 white safety helmet',label:'White',link:'https://www.milwaukeetool.eu/en-eu/bolt-100/bolt-100/?variant=1012572'},
        {image:'https://static.milwaukeetool.eu/remote.axd/milwaukee-media-images.s3.amazonaws.com/hi/4932478913--Hero_1.png',thumbnailImage:'',swatchColour:'#ffdd00',altText:'BOLT 100 yellow safety helmet',label:'Yellow',link:''},
        {image:'https://static.milwaukeetool.eu/remote.axd/milwaukee-media-images.s3.amazonaws.com/hi/4932478914--Hero_1.png',thumbnailImage:'',swatchColour:'#0057b8',altText:'BOLT 100 blue safety helmet',label:'Blue',link:''},
        {image:'https://static.milwaukeetool.eu/remote.axd/milwaukee-media-images.s3.amazonaws.com/hi/4932478915--Hero_1.png',thumbnailImage:'',swatchColour:'#00843d',altText:'BOLT 100 green safety helmet',label:'Green',link:''},
        {image:'https://static.milwaukeetool.eu/remote.axd/milwaukee-media-images.s3.amazonaws.com/hi/4932478916--Hero_1.png',thumbnailImage:'',swatchColour:'#db011c',altText:'BOLT 100 red safety helmet',label:'Red',link:''},
        {image:'https://static.milwaukeetool.eu/remote.axd/milwaukee-media-images.s3.amazonaws.com/hi/4932478917--Hero_1.png',thumbnailImage:'',swatchColour:'#000000',altText:'BOLT 100 black safety helmet',label:'Black',link:''},
        {image:'https://static.milwaukeetool.eu/remote.axd/milwaukee-media-images.s3.amazonaws.com/hi/4932480663--Hero_1.png',thumbnailImage:'',swatchColour:'#ff8200',altText:'BOLT 100 orange safety helmet',label:'Orange',link:''},
        {image:'https://static.milwaukeetool.eu/remote.axd/milwaukee-media-images.s3.amazonaws.com/hi/4932480664--Hero_1.png',thumbnailImage:'',swatchColour:'#d7ff00',altText:'BOLT 100 high visibility yellow safety helmet',label:'High visibility yellow',link:''},
        {image:'https://static.milwaukeetool.eu/remote.axd/milwaukee-media-images.s3.amazonaws.com/hi/4932478122--Hero_1.png',thumbnailImage:'',swatchColour:'#cccccc',altText:'BOLT 100 placeholder option 9',label:'Option 9',link:''},
        {image:'https://static.milwaukeetool.eu/remote.axd/milwaukee-media-images.s3.amazonaws.com/hi/4932478122--Hero_1.png',thumbnailImage:'',swatchColour:'#999999',altText:'BOLT 100 placeholder option 10',label:'Option 10',link:''}
      ]
    };
    function clone(value){ return JSON.parse(JSON.stringify(value)); }
    const state = { sdk:null, blockData: clone(defaults) };
    const $ = id => document.getElementById(id);
    function esc(v){return String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
    function js(v){return String(v ?? '').replace(/\\/g,'\\\\').replace(/`/g,'\\`').replace(/\$\{/g,'\\${');}
    function renderOptions(){
      $('optionsContainer').innerHTML = labels.map((word,i)=>`<div class="option-card"><h3>Option ${i+1}</h3><div class="field-group"><label class="field-label">Main Image URL</label><input class="field-input option-input" data-index="${i}" data-key="image" type="url"></div><div class="field-group thumbnail-fields"><label class="field-label">Thumbnail Image URL</label><input class="field-input option-input" data-index="${i}" data-key="thumbnailImage" type="url"><div class="hint">Leave blank to use the main image.</div></div><div class="field-group"><label class="field-label">Swatch Colour</label><input class="field-input option-input" data-index="${i}" data-key="swatchColour" type="text"></div><div class="field-group"><label class="field-label">Alt Text</label><input class="field-input option-input" data-index="${i}" data-key="altText" type="text"></div><div class="field-group"><label class="field-label">Label</label><input class="field-input option-input" data-index="${i}" data-key="label" type="text"></div><div class="field-group"><label class="field-label">Option Link</label><input class="field-input option-input" data-index="${i}" data-key="link" type="url"><div class="hint">Leave blank to use the product page link.</div></div></div>`).join('');
    }
    function syncUI(){
      ['moduleName','numberOfColourOptions','coloursPerRow','productPageLink','buttonText','buttonLink','fallbackImage','fallbackImageAltText'].forEach(k=>$(k).value=state.blockData[k]);
      document.querySelectorAll('#thumbnailStyleSelector .option-button').forEach(b=>b.classList.toggle('selected',b.dataset.value===state.blockData.thumbnailStyle));
      document.querySelectorAll('#backgroundColourSelector .option-button').forEach(b=>b.classList.toggle('selected',b.dataset.value===state.blockData.backgroundColour));
      document.body.classList.toggle('show-thumbnails', state.blockData.thumbnailStyle === 'images');
      document.querySelectorAll('.option-input').forEach(input=>{input.value = state.blockData.options[Number(input.dataset.index)][input.dataset.key] || '';});
    }
    function readUI(){
      ['moduleName','productPageLink','buttonText','buttonLink','fallbackImage','fallbackImageAltText'].forEach(k=>state.blockData[k]=$(k).value.trim());
      state.blockData.numberOfColourOptions = Math.max(1, Math.min(10, parseInt($('numberOfColourOptions').value,10)||1));
      state.blockData.coloursPerRow = Math.max(1, Math.min(5, parseInt($('coloursPerRow').value,10)||4));
      state.blockData.thumbnailStyle = document.querySelector('#thumbnailStyleSelector .selected')?.dataset.value || 'swatches';
      state.blockData.backgroundColour = document.querySelector('#backgroundColourSelector .selected')?.dataset.value || 'black';
      document.querySelectorAll('.option-input').forEach(input=>{state.blockData.options[Number(input.dataset.index)][input.dataset.key]=input.value.trim();});
      document.body.classList.toggle('show-thumbnails', state.blockData.thumbnailStyle === 'images');
    }
    function ampscriptSettings(d){
      const set = (n,v)=>`set @${n} = "${String(v||'').replace(/"/g,"'")}"`;
      let out = `%%[\n/* COLOUR / THUMBNAIL IMAGE SWAP MODULE SETTINGS */\n${set('moduleName',d.moduleName)}\nset @numberOfColourOptions = ${d.numberOfColourOptions}\nset @coloursPerRow = ${d.coloursPerRow}\n${set('thumbnailStyle',d.thumbnailStyle)}\n${set('productPageLink',d.productPageLink)}\n${set('buttonLink',d.buttonLink)}\n${set('buttonText',d.buttonText)}\n${set('backgroundColour',d.backgroundColour)}\n${set('fallbackImage',d.fallbackImage)}\n${set('fallbackImageAltText',d.fallbackImageAltText)}\n`;
      d.options.forEach((o,i)=>{const w=labels[i];out+=`\n/* Option ${i+1} */\n${set('colour'+w+'Image',o.image)}\n${set('colour'+w+'ThumbnailImage',o.thumbnailImage)}\n${set('colour'+w+'SwatchColour',o.swatchColour)}\n${set('colour'+w+'AltText',o.altText)}\n${set('colour'+w+'Label',o.label)}\n${set('colour'+w+'Link',o.link)}\n`;});
      return out;
    }
    function generateTemplate(){
      const d = state.blockData;
      const names = labels.map(w=>'@colour'+w);
      return `${ampscriptSettings(d)}
/* MODULE LOGIC */
set @moduleName = Replace(Lowercase(Trim(@moduleName)), " ", "-")
set @moduleClass = Concat("mwk-", @moduleName, "-interactive")
set @thumbnailStyle = Lowercase(Trim(@thumbnailStyle))
if @thumbnailStyle != "images" then set @thumbnailStyle = "swatches" endif
if Empty(@numberOfColourOptions) then set @numberOfColourOptions = 1 endif
if @numberOfColourOptions < 1 then set @numberOfColourOptions = 1 elseif @numberOfColourOptions > 10 then set @numberOfColourOptions = 10 endif
if Empty(@coloursPerRow) then set @coloursPerRow = 4 endif
if @coloursPerRow < 1 then set @coloursPerRow = 1 elseif @coloursPerRow > 5 then set @coloursPerRow = 5 endif
set @backgroundColour = Lowercase(Trim(@backgroundColour))
if @backgroundColour == "red" then set @backgroundColourHex = "#B50018" set @selectedRingColour = "#ffffff" elseif @backgroundColour == "white" then set @backgroundColourHex = "#ffffff" set @selectedRingColour = "#000000" else set @backgroundColourHex = "#000000" set @selectedRingColour = "#ffffff" endif
if @backgroundColour == "black" then set @buttonClass = "button-2-white button-mobile-center" set @buttonTableStyle = "background-color: transparent; border: 2px solid #ffffff; border-collapse: separate; border-radius: 4px !important;" set @buttonTextColour = "#ffffff" else set @buttonClass = "button-1-black button-mobile-center" set @buttonTableStyle = "background-color: #000000; border-radius: 4px !important;" set @buttonTextColour = "#ffffff" endif
set @buttonLink = Trim(@buttonLink)
if Empty(@buttonLink) then set @buttonFinalLink = @productPageLink else set @buttonFinalLink = @buttonLink endif
set @optionImages = Concat(${names.map(n=>n+'Image').join(',"|",')})
set @optionThumbnailImages = Concat(${names.map(n=>`Iif(Empty(Trim(${n}ThumbnailImage)),${n}Image,${n}ThumbnailImage)`).join(',"|",')})
set @optionSwatchColours = Concat(${names.map(n=>n+'SwatchColour').join(',"|",')})
set @optionAltTexts = Concat(${names.map(n=>n+'AltText').join(',"|",')})
set @optionLabels = Concat(${names.map(n=>n+'Label').join(',"|",')})
set @optionLinks = Concat(${names.map(n=>`Iif(Empty(Trim(${n}Link)),@productPageLink,${n}Link)`).join(',"|",')})
set @optionImageRows = BuildRowsetFromString(@optionImages, "|")
set @optionThumbnailImageRows = BuildRowsetFromString(@optionThumbnailImages, "|")
set @optionSwatchColourRows = BuildRowsetFromString(@optionSwatchColours, "|")
set @optionAltTextRows = BuildRowsetFromString(@optionAltTexts, "|")
set @optionLabelRows = BuildRowsetFromString(@optionLabels, "|")
set @optionLinkRows = BuildRowsetFromString(@optionLinks, "|")
set @imageWidth = "580"
]%%

    function refresh(){readUI(); const html=generateTemplate(); if(state.sdk){state.sdk.setContent(html); state.sdk.setData({...state.blockData,content:html});}}
    function initHandlers(){
      document.body.addEventListener('input', e=>{if(e.target.classList.contains('field-input')) refresh();});
      document.body.addEventListener('click', e=>{if(e.target.classList.contains('option-button')){e.target.parentElement.querySelectorAll('.option-button').forEach(b=>b.classList.remove('selected'));e.target.classList.add('selected');refresh();}});
    }
    function load(){
      $('loadingOverlay').classList.add('show');
      state.sdk.getData(data=>{state.blockData = {...clone(defaults), ...(data||{})}; state.blockData.options = labels.map((_,i)=>({...defaults.options[i], ...((data&&data.options&&data.options[i])||{})})); renderOptions(); syncUI(); refresh(); $('loadingOverlay').classList.remove('show');});
    }
    function initialize(){
      renderOptions(); initHandlers();
      if(window.sfdc && window.sfdc.BlockSDK){state.sdk=new window.sfdc.BlockSDK({tabs:['htmlblock']}); load();} else {syncUI();}
    }
    document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', initialize) : initialize();
