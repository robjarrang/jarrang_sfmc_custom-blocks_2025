<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Membership Card settings</title><link rel="stylesheet" href="../../../../../shared-assets/runtime-188c732f1acf1312/runtime.bundle.css"><style></style></head><body><main class="editor"><h1 id="block-name"></h1><p id="status" class="status" role="status" aria-live="polite">Loading module…</p><fieldset id="fields" disabled></fieldset></main><aside id="standalone-area"></aside><script type="application/json" id="block-definition">{"id":"2fefeb31-f9ab-4094-885e-bd427999a544","name":"Membership Card","slug":"membership-card","release":"1.0.0","source":"\u003c!-- %%[\n/* =========================================================\n   MEMBER PROFILE\n   Personalisation source: sendable data\n   Fixed orange visual treatment\n   ========================================================= */\n\nVAR @MemberSalutation\nVAR @MemberFirstName\nVAR @MemberLastName\nVAR @MemberProfession\nVAR @MemberLevel\nVAR @MemberLevelMatch\nVAR @MemberEscId\nVAR @MemberDisplayName\nVAR @MemberProfileURL\nVAR @MemberMeta\n\nSET @MemberSalutation = Trim(AttributeValue(\"Salutation\"))\nSET @MemberFirstName = Trim(AttributeValue(\"FirstName\"))\nSET @MemberLastName = Trim(AttributeValue(\"Last Name\"))\nSET @MemberProfession = Trim(AttributeValue(\"Profession\"))\nSET @MemberLevel = Trim(AttributeValue(\"ESC Product\"))\nSET @MemberEscId = Trim(AttributeValue(\"ESCID\"))\n\nSET @MemberProfileURL = \"https://escardio.my.site.com/MyESC/s/profile\"\n\n/* Default salutation used by the existing email */\nIF EMPTY(@MemberSalutation) THEN\n  SET @MemberSalutation = \"Dr\"\nENDIF\n\n/* Build the displayed member name */\nIF EMPTY(@MemberFirstName) AND EMPTY(@MemberLastName) THEN\n\n  SET @MemberDisplayName = \"Member\"\n\nELSE\n\n  SET @MemberDisplayName = @MemberSalutation\n\n  IF NOT EMPTY(@MemberFirstName) THEN\n    SET @MemberDisplayName = Concat(\n      @MemberDisplayName,\n      \" \",\n      @MemberFirstName\n    )\n  ENDIF\n\n  IF NOT EMPTY(@MemberLastName) THEN\n    SET @MemberDisplayName = Concat(\n      @MemberDisplayName,\n      \" \",\n      @MemberLastName\n    )\n  ENDIF\n\nENDIF\n\n/* Normalise the membership product for comparison */\nSET @MemberLevelMatch = Uppercase(@MemberLevel)\n\n/* Working Group membership */\nIF IndexOf(@MemberLevelMatch, \"WG ON\") > 0 THEN\n  SET @MemberLevel = \"Working Group Regular\"\n  SET @MemberLevelMatch = \"WORKING GROUP REGULAR\"\nENDIF\n\n/* Format established membership titles */\nIF IndexOf(@MemberLevelMatch, \"REGULAR\") > 0 THEN\n\n  IF IndexOf(Uppercase(@MemberLevel), \"MEMBER\") == 0 THEN\n    SET @MemberLevel = Concat(@MemberLevel, \" Member\")\n  ENDIF\n\nELSEIF IndexOf(@MemberLevelMatch, \"IVORY\") > 0 THEN\n\n  IF IndexOf(Uppercase(@MemberLevel), \"MEMBER\") == 0 THEN\n    SET @MemberLevel = Concat(@MemberLevel, \" Member\")\n  ENDIF\n\nELSEIF IndexOf(@MemberLevelMatch, \"SILVER\") > 0 THEN\n\n  IF IndexOf(Uppercase(@MemberLevel), \"MEMBER\") == 0 THEN\n    SET @MemberLevel = Concat(@MemberLevel, \" Member\")\n  ENDIF\n\nELSEIF IndexOf(@MemberLevelMatch, \"GOLD\") > 0 THEN\n\n  IF IndexOf(Uppercase(@MemberLevel), \"MEMBER\") == 0 THEN\n    SET @MemberLevel = Concat(@MemberLevel, \" Member\")\n  ENDIF\n\nELSEIF IndexOf(@MemberLevelMatch, \"FELLOW\") > 0 THEN\n\n  IF IndexOf(@MemberLevelMatch, \"EHRA\") > 0 THEN\n    SET @MemberLevel = \"Fellow of the EHRA\"\n\n  ELSEIF IndexOf(@MemberLevelMatch, \"HFA\") > 0 THEN\n    SET @MemberLevel = \"Fellow of the HFA\"\n\n  ELSE\n    SET @MemberLevel = \"Fellow of the ESC\"\n  ENDIF\n\nENDIF\n\n/* Combine profession and membership information */\nSET @MemberMeta = \"\"\n\nIF NOT EMPTY(@MemberProfession) THEN\n  SET @MemberMeta = @MemberProfession\nENDIF\n\nIF NOT EMPTY(@MemberLevel) THEN\n\n  IF NOT EMPTY(@MemberMeta) THEN\n    SET @MemberMeta = Concat(\n      @MemberMeta,\n      \" &bull; \",\n      @MemberLevel\n    )\n  ELSE\n    SET @MemberMeta = @MemberLevel\n  ENDIF\n\nENDIF\n]%% -->\u003c!-- START .esc-member-profile-card -->\u003ctable align=\"center\" bgcolor=\"#ffffff\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\" class=\"content-outer esc-member-profile-wrap\" role=\"presentation\" style=\"background-color: #ffffff; width: 620px;\" width=\"620\">\n \n  \u003ctr>\n   \u003ctd bgcolor=\"#ffffff\" class=\"side\" style=\"background-color: #ffffff; width: 20px;\" width=\"20\">\n    &nbsp;\u003c/td>\u003ctd bgcolor=\"#ffffff\" class=\"content-inner\" style=\"background-color: #ffffff; padding: 20px 0; width: 580px;\" valign=\"top\" width=\"580\">\n    \u003ctable bgcolor=\"#EF7918\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\" class=\"sect esc-member-profile-card\" role=\"presentation\" style=\"background-color: #EF7918 !important; background-image: linear-gradient(#EF7918, #EF7918); border-collapse: separate; border-radius: 16px; width: 100%;\" width=\"100%\">\n     \n      \u003ctr>\n       \u003ctd bgcolor=\"#EF7918\" style=\"background-color: #EF7918 !important; background-image: linear-gradient(#EF7918, #EF7918); border-radius: 16px; padding: 24px; width: 532px;\" valign=\"top\" width=\"532\">\n        \u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\" role=\"presentation\" style=\"border-collapse: collapse; mso-table-lspace: 0pt; mso-table-rspace: 0pt; width: 100%;\" width=\"100%\">\n         \n          \u003ctr>\n           \u003c!-- Member details -->\u003ctd class=\"block mobile-stack\" style=\"padding: 0;\" valign=\"middle\">\n            \u003cp style=\"color: #FDE9D8 !important; -webkit-text-fill-color: #FDE9D8 !important; font-family: 'mulish-variable', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif !important; font-size: 13px; font-style: italic; line-height: 19px; margin: 0 0 2px; mso-line-height-rule: exactly;\">\n             \u003cspan style=\"color: #FDE9D8 !important; -webkit-text-fill-color: #FDE9D8 !important;\">\u003cfont color=\"#FDE9D8\">Hello,\u003c/font> \u003c/span>\u003c/p>\u003ch3 style=\"color: #ffffff !important; -webkit-text-fill-color: #ffffff !important; font-family: 'enra-slab-variable', Rockwell, Arial, Helvetica, sans-serif !important; font-size: 22px; font-weight: 700; line-height: 28px; margin: 0 0 6px; mso-line-height-rule: exactly;\">\n             \u003cspan style=\"color: #ffffff !important; -webkit-text-fill-color: #ffffff !important;\">\u003cfont color=\"#ffffff\">%%=v(@MemberDisplayName)=%% \u003c/font> \u003c/span>\u003c/h3>\u003c!-- %%[ IF NOT EMPTY(@MemberMeta) THEN ]%% -->\u003cp style=\"color: #ffffff !important; -webkit-text-fill-color: #ffffff !important; font-family: 'mulish-variable', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif !important; font-size: 13px; line-height: 20px; margin: 0 0 12px; mso-line-height-rule: exactly;\">\n             \u003cspan style=\"color: #ffffff !important; -webkit-text-fill-color: #ffffff !important;\">\u003cfont color=\"#ffffff\">%%=v(@MemberMeta)=%% \u003c/font> \u003c/span>\u003c/p>\u003c!-- %%[ ENDIF ]%% -->\u003cp style=\"margin: 0;\">\n             \u003ca href=\"%%=RedirectTo(@MemberProfileURL)=%%\" style=\"color: #ffffff !important; -webkit-text-fill-color: #ffffff !important; font-family: 'mulish-variable', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif !important; font-size: 13px; font-weight: 700; line-height: 20px; mso-line-height-rule: exactly; text-decoration: underline !important; text-decoration-color: #ffffff !important;\" target=\"_blank\">\u003cspan style=\"color: #ffffff !important; -webkit-text-fill-color: #ffffff !important; text-decoration: underline !important;\">\u003cfont color=\"#ffffff\">Update your profile &rarr; \u003c/font> \u003c/span> \u003c/a>\u003c/p>\u003c/td>\u003c!-- %%[ IF NOT EMPTY(@MemberEscId) THEN ]%% -->\u003c!-- ESC ID badge -->\u003ctd align=\"right\" class=\"block\" style=\"padding-left: 16px; width: 120px;\" valign=\"middle\" width=\"120\">\n            \u003ctable align=\"center\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\" role=\"presentation\" style=\"border-collapse: collapse; margin: 0 auto; mso-table-lspace: 0pt; mso-table-rspace: 0pt;\">\n             \n              \u003ctr>\n               \u003ctd align=\"center\" bgcolor=\"#ffffff\" style=\"background-color: #ffffff !important; background-image: linear-gradient(#ffffff, #ffffff); border-radius: 8px; padding: 12px 16px;\" valign=\"top\">\n                \u003cp style=\"color: #666666 !important; -webkit-text-fill-color: #666666 !important; font-family: 'mulish-variable', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif !important; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; line-height: 14px; margin: 0 0 2px; mso-line-height-rule: exactly; text-transform: uppercase;\">\n                 \u003cspan style=\"color: #666666 !important; -webkit-text-fill-color: #666666 !important;\">\u003cfont color=\"#666666\">ESC ID\u003c/font> \u003c/span>\u003c/p>\u003cp style=\"color: #1a1a1a !important; -webkit-text-fill-color: #1a1a1a !important; font-family: 'enra-slab-variable', Rockwell, Arial, Helvetica, sans-serif !important; font-size: 22px; font-weight: 700; line-height: 26px; margin: 0; mso-line-height-rule: exactly;\">\n                 \u003cspan style=\"color: #1a1a1a !important; -webkit-text-fill-color: #1a1a1a !important;\">\u003cfont color=\"#1a1a1a\">%%=v(@MemberEscId)=%% \u003c/font> \u003c/span>\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/td>\u003c!-- %%[ ENDIF ]%% -->\u003c/tr>\u003c/table>\u003c/td>\u003c/tr>\u003c/table>\u003c/td>\u003ctd bgcolor=\"#ffffff\" class=\"side\" style=\"background-color: #ffffff; width: 20px;\" width=\"20\">\n    &nbsp;\u003c/td>\u003c/tr>\u003c/table>\u003c!-- END .esc-member-profile-card -->","templateMode":false,"contextCss":"","fields":[{"label":"Greeting","type":"text","defaultValue":"Hello,","originalValue":"Hello,","enabled":true,"required":true,"maxLength":40,"help":"Shown above the member’s name.","targets":[{"start":4967,"end":4973,"nodeId":"n12","kind":"content","originalValue":"Hello,"}],"id":"field1"},{"label":"Profile link text","type":"text","defaultValue":"Update your profile →","originalValue":"Update your profile →","enabled":true,"required":true,"maxLength":40,"help":"Links to the member’s MyESC profile.","targets":[{"start":6595,"end":6621,"nodeId":"n22","kind":"content","originalValue":"Update your profile →"}],"allowLinks":false,"id":"field2"},{"label":"Badge label","type":"text","defaultValue":"ESC ID","originalValue":"ESC ID","enabled":true,"required":true,"maxLength":20,"help":"Shown above the ESC ID. The badge only appears when the member has an ESC ID.","targets":[{"start":7768,"end":7774,"nodeId":"n29","kind":"content","originalValue":"ESC ID"}],"id":"field3"}],"showEditorHeader":false}</script><script src="../../../../../shared-assets/runtime-188c732f1acf1312/runtime.bundle.js"></script></body></html>
